{% extends "base.html" %}
{% block title %}Not allowed{% endblock %}
{% block content %}
<div class="row justify-content-center auth-page">
  <div class="col-md-6 col-lg-5">
    <div class="card auth-card mx-auto">
      <div class="card-body text-center">
        <p class="page-eyebrow">403 error</p>
        <h1 class="auth-title">Access not allowed</h1>
        <p class="auth-description">You do not have permission to view this page.</p>
        <a class="btn btn-primary" href="{% url 'dashboard' %}">Go to dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
