{% extends "base.html" %}
{% block title %}Reset link sent{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Check your email</h1>
        <p class="mb-0">If an account exists with that email, a password-reset link has been sent.
        In local development the email is printed to the <code>runserver</code> console.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
