{% extends "base.html" %}
{% block title %}Reset link sent{% endblock %}
{% block content %}
<div class="auth-page row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card auth-card mx-auto">
      <div class="card-body text-center">
        <div class="auth-logo justify-content-center"><span class="brand-mark">IE</span> Inner Eye</div>
        <h1 class="auth-title">Check your email</h1>
        <p class="auth-description mb-0">If an account exists with that email, a password-reset link has been sent.
        In local development the email is printed to the <code>runserver</code> console.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
