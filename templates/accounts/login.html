{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Log in</h1>
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Employee ID</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
          </div>
          <button class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 small text-muted">New employee? <a href="{% url 'register' %}">Register here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
