{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="auth-page row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card auth-card mx-auto">
      <div class="card-body text-center">
        <div class="auth-logo justify-content-center"><span class="brand-mark">IE</span> Inner Eye</div>
        <h1 class="auth-title">Password changed</h1>
        <p class="auth-description">Your password has been updated successfully.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
